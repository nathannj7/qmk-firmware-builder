name: Build Custom Vial Firmware

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QMK Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qmk milc argcomplete dotty-dict

      - name: Cache QMK
        uses: actions/cache@v4
        with:
          path: |
            ~/.build_cache
            vial-qmk
          key: ${{ runner.os }}-qmk-${{ hashFiles('**/rules.mk') }}

      - name: Setup Environment and Compile
        run: |
          if [ ! -d "vial-qmk" ]; then
            # FIX: Restored the complete official Vial QMK repository URL
            git clone --depth=1 --recursive https://github.com
          fi
          # Clear old targets and copy your custom setup over
          rm -rf vial-qmk/keyboards/handwired/ellipsis_split_v2
          mkdir -p vial-qmk/keyboards/handwired/ellipsis_split_v2
          cp -r keyboards/handwired/ellipsis_split_v2/* vial-qmk/keyboards/handwired/ellipsis_split_v2/
          
          cd vial-qmk
          make handwired/ellipsis_split_v2:vial
          
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ellipsis-vial-firmware
          path: vial-qmk/*.hex
