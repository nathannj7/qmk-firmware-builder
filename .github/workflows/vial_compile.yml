name: Compile Ellipsis Split V2 Firmware

on:
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch, Patch, and Compile Clean Vial Source
        run: |
          # 1. Guarantee complete isolation
          rm -rf vial-qmk github.com
          
          # 2. Clean clone the official Vial repository
          git clone --depth=1 --recursive https://github.com vial-qmk
          
          # 3. FIX PYTHON 3.14 BUG: Replace the broken ast.Num with Python 3.14 compatible ast.Constant
          sed -i 's/isinstance(node, ast.Num):/isinstance(node, (ast.Num, ast.Constant)):/g' vial-qmk/lib/python/qmk/math.py
          sed -i 's/return node.n/return getattr(node, "n", getattr(node, "value", None))/g' vial-qmk/lib/python/qmk/math.py
          
          # 4. Construct layout mapping space
          mkdir -p vial-qmk/keyboards/handwired/ellipsis_split_v2
          cp -r keyboards/handwired/ellipsis_split_v2/* vial-qmk/keyboards/handwired/ellipsis_split_v2/
          
          # 5. Move into target directory and fire compiler
          cd vial-qmk
          make handwired/ellipsis_split_v2:vial
          
      - name: Export Completed Hex Binary
        uses: actions/upload-artifact@v4
        with:
          name: ellipsis-vial-firmware
          path: vial-qmk/*.hex
