name: Compile Ellipsis Split V2 Firmware

on:
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install AVR Compiler Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc make git

      - name: Fetch and Compile Clean Vial Source
        run: |
          # 1. Clear out any old traces
          rm -rf vial-qmk github.com qmk_firmware
          
          # 2. Clean clone the official Vial repository
          git clone --depth=1 --recursive https://github.com vial-qmk
          
          # 3. Construct layout mapping space
          mkdir -p vial-qmk/keyboards/handwired/ellipsis_split_v2
          cp -r keyboards/handwired/ellipsis_split_v2/* vial-qmk/keyboards/handwired/ellipsis_split_v2/
          
          # 4. Compile directly using the C-Toolchain (Bypassing Python entirely)
          cd vial-qmk
          make handwired/ellipsis_split_v2:vial
          
      - name: Export Completed Hex Binary
        uses: actions/upload-artifact@v4
        with:
          name: ellipsis-vial-firmware
          path: vial-qmk/*.hex
