name: Build Custom Vial Firmware

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QMK Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qmk milc argcomplete dotty-dict

      - name: Setup Environment and Compile
        run: |
          # 1. Guarantee a completely clean slate by destroying any existing folders
          rm -rf vial-qmk
          rm -rf github.com
          
          # 2. Clone the absolute, fully qualified URL
          git clone --depth=1 --recursive https://github.com vial-qmk
          
          # 3. Rebuild the destination directory structure
          mkdir -p vial-qmk/keyboards/handwired/ellipsis_split_v2
          
          # 4. Copy your keyboard files over safely
          cp -r keyboards/handwired/ellipsis_split_v2/* vial-qmk/keyboards/handwired/ellipsis_split_v2/
          
          # 5. Jump into the repository and compile
          cd vial-qmk
          make handwired/ellipsis_split_v2:vial
          
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ellipsis-vial-firmware
          path: vial-qmk/*.hex
